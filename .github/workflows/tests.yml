name: Offline tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked environment
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline regression and dashboard tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-results
          path: test-results.xml
          if-no-files-found: ignore
